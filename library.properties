name=HydroNode-Library
version=1.9.0
author=Felix Knoll
maintainer=Felix Knoll <contact@hydronode.tech>
sentence=Send signed sensor data to HydroNode over WiFi, Ethernet, LTE-M, NB-IoT or any Arduino Client.
paragraph=Easy API client for HydroNode sensors and actuators, with typed command callbacks, HMAC-SHA256 auth, TLS with bundled root CAs, time sync (NTP, modem clock or your own), battery thresholds (HydroNodeBatteryGuard) and pluggable transports: ESP32/ESP8266 WiFi and Ethernet, W5500, cellular via TinyGSM (SIM7080G, A7670, BG95 ...) with WiFi fallback, or any TLS Client (UNO R4 WiFi, MKR, Pico W, nRF52, STM32).
category=Communication
url=https://hydronode.tech/docs/guide/arduino/
architectures=esp32,esp8266,rp2040,mbed_rp2040,samd,nrf52,mbed_nano,renesas_uno,stm32
license=MIT
depends=ArduinoJson (>=7.0.0), ArduinoHttpClient, WiFiManager
